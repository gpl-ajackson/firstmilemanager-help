# The Ignored Words: GLOSSARY.md avoid words that are also everyday English in another sense,
# which the Words check (Launch Check 5) skips everywhere. Each line says the sense help uses.
# Add a word only when it keeps failing a correct use; one that GLOSSARY.md no longer lists is
# reported by the Words check. To name an avoid word as the wrong word, quote it instead.

# A web link, such as an invitation's "link to accept" (GLOSSARY.md avoids it for a Connection).
- link
# The person who set the business up, as Settings and the People list label them (GLOSSARY.md
# avoids it as a name for the Admin role).
- owner
# A registered company, as in the client form's "Company registration number" (GLOSSARY.md avoids
# it as a name for an Operator).
- company
# The place goods are collected from, as in a Collection Address's "Site contact" (GLOSSARY.md
# avoids it as a name for a Collection Address).
- site
