# The Term Status of every term in the main project's GLOSSARY.md (gpl-ajackson/firstmilemanager),
# in GLOSSARY.md's order and under its section headings. Launch Check 4 (the Glossary Check) reads it.
#
#   status        Published: readers meet it on a screen of First Mile Manager as built, so it has a Glossary Entry.
#                 Internal: readers never see it by name, so it is never published.
#                 Not built yet: its feature isn't built; it is published the day the feature ships.
#   product_area  its home Product Area: the area whose Articles use it, whose ticket (or Help
#                 Proposal) writes its Glossary Entry, so no two write the same entry. A Published
#                 term's area is on the Product Area list (product-areas.yaml).
#   ahead         true when its entries say less than GLOSSARY.md, because GLOSSARY.md already
#                 describes a later slice: the Glossary Check reports it until the rest ships.
#                 Only on a Published term.
#   fingerprint   GLOSSARY.md's definition when its entries were last checked against it. When the
#                 definition changes, the Glossary Check reports it with the new fingerprint to set.
#   stockist_fingerprint
#                 only on a term Stockist's GLOSSARY.md has too (a shared term): Stockist's definition
#                 when this term's entries and Articles were last checked against it, so help means
#                 by it what Stockist means. A shared term without one fails the Glossary Check; a
#                 change to Stockist's definition is reported with the new one to set. A Team Role
#                 holds its own powers in each app, so a role's entry says what it does in First
#                 Mile Manager and never contradicts what it is in Stockist.
#
# Built or not was judged from the main project's code after slice 0 (spec #57, 81a5430, 14
# November 2026). FMM-only and Joint reach readers only as the Setup Type's two values, explained
# in its entry; the Headless Team is never named to its Operator. The demo's terms are for
# whoever runs the demo, not for readers. A main-project change that adds, renames or changes a
# term sets its Term Status here in its help pull request (the main project's
# docs/agents/help-content.md).

