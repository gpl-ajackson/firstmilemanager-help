name: Help Preview

# A Help Preview (#59, spec #30 user stories 126 to 128) for every support-site pull request: a
# static copy of the pages readers would see once it merges, Draft Articles marked as drafts,
# written by `php artisan help:preview` and deployed to the Cloudflare Pages project
# HELP_PREVIEW_PAGES_PROJECT (fmm-help-previews) as the branch pr-<number>, at
# https://pr-<number>.<project>.pages.dev. Cloudflare Access ("Help centre") guards every
# *.fmm-help-previews.pages.dev address, so only AJ and anyone AJ adds can open it. One
# comment on the pull request carries the link and is updated on each push. Closing the pull
# request deletes that branch's deployments and says so in the comment.
#
# Search and feedback show but do nothing, no page loads a script, every page says noindex, and
# the preview never reaches the help centre's server, so nothing on it is recorded or counted.
#
# The Launch Checks run on every pull request in their own workflow (launch-checks.yml), whether
# or not anyone opens the preview. This one runs no tests, to keep Actions minutes down.
#
# Secrets (repository secrets, ticket #33): CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages ·
# Edit), CLOUDFLARE_ACCOUNT_ID, and the Pages project's name HELP_PREVIEW_PAGES_PROJECT, which
# isn't secret, so it may be a repository variable instead. A pull request that can't read them
# (a fork, Dependabot) gets no preview: the job passes with a warning and says so in its summary.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# One run at a time per pull request: a new push cancels the preview still being built for the
# last one, but removing a closed pull request's preview waits for a deploy in progress to finish,
# so nothing is deployed after it was removed.
concurrency:
  group: help-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  PULL_REQUEST: ${{ github.event.pull_request.number }}
  # wrangler, pinned (the Cloudflare Pages command-line tool). It needs Node 22 or later.
  WRANGLER: wrangler@4.149.0

jobs:
  preview:
    name: Help Preview
    if: github.event.action != 'closed'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    permissions:
      contents: read
      # To post and update the preview's comment.
      pull-requests: write

    # The pull request's content is loaded into the help centre's own database, in a transaction
    # that is rolled back, so its pages can be drawn as a deploy serves them. Search isn't used:
    # the preview's search does nothing, so no Meilisearch is needed.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing

    steps:
      - name: Check for the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HELP_PREVIEW_PAGES_PROJECT: ${{ vars.HELP_PREVIEW_PAGES_PROJECT || secrets.HELP_PREVIEW_PAGES_PROJECT }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$HELP_PREVIEW_PAGES_PROJECT" ] || missing+=(HELP_PREVIEW_PAGES_PROJECT)
          if [ ${#missing[@]} -gt 0 ]; then
            message="No Help Preview for this pull request: it can't read the secrets ${missing[*]} (a fork's or Dependabot's pull request never can). The Launch Checks still run."
            echo "::warning title=No Help Preview::${message}"
            printf '## Help Preview\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        if: steps.secrets.outputs.ready == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, intl, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the help centre
        if: steps.secrets.outputs.ready == 'true'
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      # Mermaid diagrams are drawn as the content is rebuilt, with the pinned tool in
      # tools/diagrams (Chromium through Playwright). Content with no diagram needs neither.
      - name: Install the diagram tool, if the content has diagrams
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if grep -rqs '^```mermaid' content/; then
            npm ci --prefix tools/diagrams --no-audit --no-fund
            npx --prefix tools/diagrams playwright install --with-deps chromium
          fi

      - name: Write the Help Preview
        if: steps.secrets.outputs.ready == 'true'
        run: php artisan help:preview --into="$RUNNER_TEMP/help-preview" --pull-request="$PULL_REQUEST"

      - name: Deploy it to Cloudflare Pages
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HELP_PREVIEW_PAGES_PROJECT: ${{ vars.HELP_PREVIEW_PAGES_PROJECT || secrets.HELP_PREVIEW_PAGES_PROJECT }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes "$WRANGLER" pages deploy "$RUNNER_TEMP/help-preview" \
            --project-name="$HELP_PREVIEW_PAGES_PROJECT" \
            --branch="pr-$PULL_REQUEST" \
            --commit-hash="$HEAD_SHA" \
            --commit-message="Help Preview of pull request #$PULL_REQUEST" \
            --commit-dirty=true

      # When Cloudflare refuses (most often "The Pages project does not exist"), the run shows
      # which accounts the token reaches and which Pages projects that account has, so a wrong
      # account ID, token or project name can be told apart. Only reads; GitHub masks the values
      # that match a secret, so the account in CLOUDFLARE_ACCOUNT_ID shows as ***.
      - name: Show what the Cloudflare token can see
        if: failure() && steps.secrets.outputs.ready == 'true' && steps.deploy.outcome == 'failure'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "The accounts this token can reach (it needs Account Settings: Read to list them):"
          npx --yes "$WRANGLER" whoami || true
          echo "The Pages projects in the account named by CLOUDFLARE_ACCOUNT_ID:"
          npx --yes "$WRANGLER" pages project list

      # One comment per pull request, found by its first line and updated in place. Posting it
      # never fails the job (a fork's token can't comment).
      - name: Post the preview's link on the pull request
        if: (success() || failure()) && steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HELP_PREVIEW_PAGES_PROJECT: ${{ vars.HELP_PREVIEW_PAGES_PROJECT || secrets.HELP_PREVIEW_PAGES_PROJECT }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          link="https://pr-$PULL_REQUEST.$HELP_PREVIEW_PAGES_PROJECT.pages.dev"
          comment_file="$RUNNER_TEMP/help-preview-comment.md"
          if [ "$JOB_STATUS" = "success" ]; then
            {
              echo '<!-- help-preview -->'
              echo '## Help Preview'
              echo
              echo "**$link**"
              echo
              echo "This pull request's pages as readers will see them once it merges, at commit \`${HEAD_SHA:0:7}\`. Cloudflare Access asks you to sign in first: only people on the \"Help centre\" Access policy can open it."
              echo
              echo '- Draft Articles show here, each marked as a draft; the bar at the top of every page links to them.'
              echo '- Search and feedback show but do nothing, and nothing done on the preview is recorded or counted. Search engines never see it.'
              echo '- The link is updated on every push, and the preview is removed when the pull request closes.'
            } > "$comment_file"
            printf '## Help Preview\n\n%s\n' "$link (Cloudflare Access asks for a sign-in)" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '<!-- help-preview -->'
              echo '## Help Preview'
              echo
              echo "The Help Preview of commit \`${HEAD_SHA:0:7}\` couldn't be made: see [the run]($RUN_URL). Until a later push makes one, $link shows the last preview made, if any."
            } > "$comment_file"
          fi
          comment=$(gh api "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- help-preview -->")) | .id' | head -n 1)
          if [ -n "$comment" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment" -F body=@"$comment_file" > /dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" -F body=@"$comment_file" > /dev/null
          fi

  remove:
    name: Remove the Help Preview
    if: github.event.action == 'closed'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    permissions:
      # To update the preview's comment.
      pull-requests: write

    steps:
      # Every deployment of the branch pr-<number>, the one its link shows included, is deleted
      # through Cloudflare's API, so an old draft doesn't linger. The token is sent only in a
      # header and never printed.
      - name: Delete the pull request's deployments from Cloudflare Pages
        id: remove
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HELP_PREVIEW_PAGES_PROJECT: ${{ vars.HELP_PREVIEW_PAGES_PROJECT || secrets.HELP_PREVIEW_PAGES_PROJECT }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$HELP_PREVIEW_PAGES_PROJECT" ]; then
            message="The Help Preview of this pull request wasn't removed: this run can't read the Cloudflare secrets (a fork's or Dependabot's pull request never had a preview)."
            echo "::warning title=Help Preview not removed::${message}"
            printf '## Help Preview\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "removed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$HELP_PREVIEW_PAGES_PROJECT/deployments"
          branch="pr-$PULL_REQUEST"
          answer="$RUNNER_TEMP/cloudflare-answer.json"

          # Every page of the project's preview deployments first, then the deletes, so deleting
          # doesn't move later deployments onto pages already read.
          ids=()
          page=1
          while :; do
            curl --silent --show-error --fail-with-body --output "$answer" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api?env=preview&per_page=25&page=$page"
            mapfile -t found < <(jq -r --arg branch "$branch" \
              '.result[] | select(.deployment_trigger.metadata.branch == $branch) | .id' "$answer")
            ids+=("${found[@]}")
            pages=$(jq -r '.result_info.total_pages // 1' "$answer")
            if [ "$(jq '.result | length' "$answer")" -eq 0 ] || [ "$page" -ge "$pages" ]; then
              break
            fi
            page=$((page + 1))
          done

          for id in "${ids[@]}"; do
            # force=true deletes the deployment the branch's link points at, too.
            curl --silent --show-error --fail-with-body --output "$answer" --request DELETE \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/$id?force=true"
          done

          echo "Deleted ${#ids[@]} deployment(s) of the branch $branch."
          printf '## Help Preview\n\nRemoved: deleted %s deployment(s) of the branch %s.\n' "${#ids[@]}" "$branch" >> "$GITHUB_STEP_SUMMARY"
          echo "removed=true" >> "$GITHUB_OUTPUT"

      - name: Say on the pull request that the preview was removed
        if: steps.remove.outputs.removed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          comment=$(gh api "repos/$REPOSITORY/issues/$PULL_REQUEST/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- help-preview -->")) | .id' | head -n 1)
          if [ -n "$comment" ]; then
            printf '<!-- help-preview -->\n## Help Preview\n\nRemoved: this pull request was closed, so its Help Preview was deleted from Cloudflare Pages.\n' > "$RUNNER_TEMP/help-preview-comment.md"
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment" -F body=@"$RUNNER_TEMP/help-preview-comment.md" > /dev/null
          fi
