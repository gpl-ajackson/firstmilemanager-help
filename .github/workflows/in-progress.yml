name: In progress

# Mirrors the `in-progress` label to the project board (docs/agents/issue-tracker.md, "In progress").
# Agents and people only ever set the label, because every session can reach labels and not every
# session can reach GitHub Projects.
#
# - Label added: the issue's card moves to "In progress" on every board the issue is on.
# - Label removed from an open issue (work abandoned): the card moves back to "Backlog".
# - Issue closed: the label comes off. The board's own workflows move the card to "Done".
#
# The board belongs to a user account, which the workflow's own token can't reach, so the board
# steps use the PROJECT_BOARD_TOKEN secret: a classic personal access token with the `repo` and
# `project` scopes.

on:
  issues:
    types: [labeled, unlabeled, closed]

permissions:
  issues: write

concurrency:
  group: in-progress-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  remove-label:
    name: Take the label off a closed issue
    if: github.event.action == 'closed' && contains(github.event.issue.labels.*.name, 'in-progress')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --remove-label in-progress

  move-card:
    name: Move the card on the board
    if: >-
      github.event.label.name == 'in-progress' &&
      (github.event.action == 'labeled' ||
      (github.event.action == 'unlabeled' && github.event.issue.state == 'open'))
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          STATUS: ${{ github.event.action == 'labeled' && 'In progress' || 'Backlog' }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The PROJECT_BOARD_TOKEN secret is not set, so the card was not moved. See docs/agents/issue-tracker.md."
            exit 1
          fi

          cards=$(gh api graphql -f id="$ISSUE_ID" -f query='
            query($id: ID!) {
              node(id: $id) {
                ... on Issue {
                  projectItems(first: 20) {
                    nodes {
                      id
                      project {
                        id
                        title
                        field(name: "Status") {
                          ... on ProjectV2SingleSelectField { id options { id name } }
                        }
                      }
                    }
                  }
                }
              }
            }' --jq '.data.node.projectItems.nodes')

          if [ "$(jq length <<<"$cards")" = "0" ]; then
            echo "::warning::This issue is not on a project board, so there is no card to move."
            exit 0
          fi

          # One line per board: item id, project id, Status field id, option id, board title.
          moves=$(jq -r --arg status "$STATUS" '
            .[] | . as $card
            | ($card.project.field.options // [] | map(select((.name | ascii_downcase) == ($status | ascii_downcase))) | first) as $option
            | [$card.id, $card.project.id, ($card.project.field.id // ""), ($option.id // ""), $card.project.title] | join("|")' <<<"$cards")

          failed=0
          while IFS='|' read -r item project field option title; do
            if [ -z "$option" ]; then
              echo "::error::The board \"$title\" has no Status option called \"$STATUS\"."
              failed=1
              continue
            fi
            gh api graphql -f project="$project" -f item="$item" -f field="$field" -f option="$option" -f query='
              mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }' > /dev/null
            echo "Moved the card on \"$title\" to \"$STATUS\"."
          done <<<"$moves"
          exit $failed
